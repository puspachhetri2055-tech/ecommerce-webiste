<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard - Daraz Clone</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f5f5f5; }
      .container { max-width: 900px; margin: 0 auto; }
      .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      button { background: #f85606; color: white; border: 0; padding: 10px 14px; cursor: pointer; border-radius: 6px; }
      .order-item { border-bottom: 1px solid #eee; padding: 10px 0; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="row">
          <div>
            <h1>User Dashboard</h1>
            <p id="welcome-text">Welcome back!</p>
          </div>
          <a href="/" style="text-decoration: none;"><button type="button">Back to Store</button></a>
        </div>
      </div>

      <div class="card">
        <h2>Your Orders</h2>
        <div id="order-list">Loading orders...</div>
      </div>
    </div>

    <script>
      const currentUser = JSON.parse(localStorage.getItem('daraz-user') || 'null');
      if (!currentUser) {
        window.location.href = '/';
      }

      document.getElementById('welcome-text').textContent = `Welcome, ${currentUser?.name || 'Customer'}!`;

      async function loadOrders() {
        const list = document.getElementById('order-list');
        if (!currentUser?.email) {
          list.innerHTML = '<p>Please sign in first.</p>';
          return;
        }

        const response = await fetch(`/api/orders/${encodeURIComponent(currentUser.email)}`);
        const orders = response.ok ? await response.json() : [];

        if (orders.length === 0) {
          list.innerHTML = '<p>No orders yet. Place your first order from the store.</p>';
          return;
        }

        list.innerHTML = orders.map((order) => `
          <div class="order-item">
            <strong>Order #${order.id}</strong>
            <p>${order.address || 'No address provided'}</p>
            <p>Payment: ${order.payment || 'Cash on Delivery'}</p>
            <p>Total: Rs. ${Number(order.total || 0).toLocaleString()}</p>
          </div>
        `).join('');
      }

      loadOrders();
    </script>
  </body>
</html>
