<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Daraz Clone</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f5f5f5; }
      .container { max-width: 1000px; margin: 0 auto; }
      .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
      form { display: grid; gap: 10px; } 
      input, button { padding: 10px; font-size: 14px; }
      button { background: #f85606; color: white; border: 0; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Admin Panel</h1>
      <div class="card">
        <h2>Add Product</h2>
        <form id="product-form">
          <input id="name" placeholder="Product name" required />
          <input id="price" type="number" placeholder="Price" required />
          <input id="oldPrice" type="number" placeholder="Old price" required />
          <input id="category" placeholder="Category" required />
          <input id="image" placeholder="Image URL" required />
          <button type="submit">Save Product</button>
        </form>
      </div>
      <div class="card">
        <h2>Products</h2>
        <table>
          <thead>
            <tr><th>Name</th><th>Price</th><th>Category</th><th>Actions</th></tr>
          </thead>
          <tbody id="product-list"></tbody>
        </table>
      </div>
      <div class="card">
        <h2>Orders</h2>
        <table>
          <thead>
            <tr><th>ID</th><th>Customer</th><th>Total</th></tr>
          </thead>
          <tbody id="order-list"></tbody>
        </table>
      </div>
    </div>

    <script>
      const currentUser = JSON.parse(localStorage.getItem('daraz-user') || 'null');
      if (!currentUser || currentUser.role !== 'admin') {
        window.location.href = '/';
      }

      async function loadProducts() {
        const res = await fetch('/api/products');
        const products = await res.json();
        const list = document.getElementById('product-list');
        list.innerHTML = products.map(p => `
          <tr>
            <td>${p.name}</td>
            <td>Rs. ${p.price}</td>
            <td>${p.category}</td>
            <td>
              <button onclick="deleteProduct(${p.id})">Delete</button>
            </td>
          </tr>
        `).join('');
      }

      async function loadOrders() {
        const res = await fetch('/api/orders');
        const orders = await res.json();
        const list = document.getElementById('order-list');
        list.innerHTML = orders.map(o => `
          <tr>
            <td>${o.id}</td>
            <td>${o.customerName || 'Guest'}</td>
            <td>Rs. ${o.total || 0}</td>
          </tr>
        `).join('');
      }

      async function deleteProduct(id) {
        await fetch(`/api/products/${id}`, { method: 'DELETE' });
        loadProducts();
      }

      document.getElementById('product-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const product = {
          name: document.getElementById('name').value,
          price: Number(document.getElementById('price').value),
          oldPrice: Number(document.getElementById('oldPrice').value),
          category: document.getElementById('category').value,
          image: document.getElementById('image').value
        };
        await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(product)
        });
        e.target.reset();
        loadProducts();
      });

      loadProducts();
      loadOrders();
    </script>
  </body>
</html>
